version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: motoride_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: motoride
      POSTGRES_USER: motoride
      POSTGRES_PASSWORD: motoride
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motoride -d motoride"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: motoride_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/motoride
      SPRING_DATASOURCE_USERNAME: motoride
      SPRING_DATASOURCE_PASSWORD: motoride
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    ports:
      - "8080:8080"

volumes:
  db_data: