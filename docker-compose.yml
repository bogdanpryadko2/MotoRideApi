services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: motoride
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-motoride}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/motoride
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-motoride}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to base64 of 32 random bytes}
      JWT_ISSUER: ${JWT_ISSUER:-motoride-api}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      REFRESH_TTL: ${REFRESH_TTL:-P14D}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED:-true}
      BOOTSTRAP_USER_ENABLED: ${BOOTSTRAP_USER_ENABLED:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
volumes:
  db_data:
