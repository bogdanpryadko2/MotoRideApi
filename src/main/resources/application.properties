spring.application.name=MotoRideApi
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/motoride}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:motoride}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=32
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
spring.jackson.deserialization.fail-on-unknown-properties=true
app.auth.jwt-secret=${JWT_SECRET}
app.auth.issuer=${JWT_ISSUER:motoride-api}
app.auth.access-ttl=${JWT_ACCESS_TTL:PT15M}
app.auth.refresh-ttl=${REFRESH_TTL:P14D}
app.auth.cookie-secure=${COOKIE_SECURE:true}
app.auth.cookie-same-site=${COOKIE_SAME_SITE:Lax}
app.auth.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.bootstrap.enabled=${BOOTSTRAP_ENABLED:true}
app.bootstrap.user-enabled=${BOOTSTRAP_USER_ENABLED:true}
app.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
